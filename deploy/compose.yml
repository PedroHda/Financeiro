services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U financeiro -d financeiro"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [financeiro]
  api:
    build:
      context: ..
      dockerfile: Financeiro.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Financeiro: "Host=postgres;Database=financeiro;Username=financeiro;Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}"
      DataProtection__KeysPath: /app/private/keys
      ReverseProxy__KnownProxy: 172.30.10.10
      Auth__AllowRegistration: ${ALLOW_REGISTRATION:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-private:/app/private
    restart: unless-stopped
    networks: [financeiro]
  caddy:
    image: caddy:2
    environment:
      API_DOMAIN: ${API_DOMAIN:?Configure API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped
    networks:
      financeiro:
        ipv4_address: 172.30.10.10
networks:
  financeiro:
    ipam:
      config:
        - subnet: 172.30.10.0/24
volumes:
  postgres-data:
  api-private:
  caddy-data:
  caddy-config:
